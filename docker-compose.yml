version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employee_mgmt
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/employee_mgmt
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: employee-mgmt-system-secret-key-2024-very-long
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db-data:
